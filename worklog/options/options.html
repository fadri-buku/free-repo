<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Worklog Pomodoro \u2014 Settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>Worklog Pomodoro settings</h1>

      <section>
        <h2>Worklog file</h2>
        <p class="muted">
          Pick the file where each worklog entry will be appended. The browser will ask you
          to grant read/write access. You may be asked to re-confirm access the first time
          after restarting Chrome.
        </p>
        <p id="current" class="current">No file selected.</p>
        <div class="actions">
          <button id="pick">Choose file\u2026</button>
          <button id="pick-new" class="ghost">Create new file\u2026</button>
          <button id="clear" class="ghost danger">Clear</button>
        </div>
        <p id="error" class="error" hidden></p>
        <p id="success" class="success" hidden></p>
      </section>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
